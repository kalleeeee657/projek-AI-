name: Render Mandalika Gravity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mandalika-gravity/**'
      - '.github/workflows/mandalika-gravity.yml'
permissions:
  contents: read
concurrency:
  group: mandalika-gravity
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mandalika-gravity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install
          pip install faster-whisper==1.1.1 huggingface-hub==0.34.4 requests numpy
      - uses: actions/cache@v4
        with:
          path: mandalika-gravity/public/voice-scene-*.wav
          key: mandalika-voice-v1-${{ hashFiles('mandalika-gravity/narasi.json','mandalika-gravity/audio.py') }}
      - name: Generate Gemini voice and align subtitles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_HUB_DISABLE_XET: '1'
        run: python audio.py
      - name: Render preview frames
        run: |
          mkdir -p out/previews
          for frame in 180 600 1080 1500 1980 2460 2940 3360; do
            npx remotion still src/index.tsx MandalikaGravity "out/previews/scene-${frame}.png" --frame="$frame" --gl=swangle
          done
      - name: Render complete video
        run: npm run render
      - name: Verify output
        run: |
          ffprobe -v error -show_streams -show_format -of json out/mandalika-gravity.mp4 > out/render-report.json
          python - <<'PY'
          import json
          r=json.load(open('out/render-report.json'))
          v=next(x for x in r['streams'] if x['codec_type']=='video')
          assert (v['width'],v['height'])==(1080,1920)
          assert v['r_frame_rate']=='60/1'
          assert abs(float(r['format']['duration'])-60)<0.15
          assert any(x['codec_type']=='audio' for x in r['streams'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mandalika-gravity-video
          path: |
            mandalika-gravity/out/
            mandalika-gravity/public/voice.mp3
            mandalika-gravity/public/mix.mp3
            mandalika-gravity/public/subtitle-timing.json
            mandalika-gravity/public/alignment-report.json
          if-no-files-found: error
