name: Render video MP4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'buat-suara.py'
      - 'package.json'
      - '.github/workflows/render.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install
      - name: Generate narration and render
        run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: operasi-tulang-video
          path: |
            out/video.mp4
            public/narasi.mp3
          if-no-files-found: error
