name: Studio V6 - Lombok Snow Living World
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'video-studio-v6/lombok-snow/**'
      - '.github/workflows/studio-v6-lombok-snow.yml'
permissions:
  contents: read
concurrency:
  group: studio-v6-lombok-snow
  cancel-in-progress: false
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        scene: [first-snow, sade]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: video-studio-v6/lombok-snow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: v6-snow-npm-${{ hashFiles('video-studio-v6/lombok-snow/package.json') }}
      - run: npm install --no-audit --no-fund
      - run: node test.mjs
      - name: Render scene
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          mkdir -p out
          npx remotion still index.jsx "Scene-$SCENE" out/preview.png --frame=180 --gl=swangle
          npx remotion render index.jsx "Scene-$SCENE" out/scene.mp4 --gl=swangle --concurrency=2 --codec=h264 --crf=16
          ffprobe -v error -count_frames -show_streams -of json out/scene.mp4 > out/report.json
          python -c "import json; v=next(s for s in json.load(open('out/report.json'))['streams'] if s['codec_type']=='video'); assert (v['width'],v['height'],v['r_frame_rate'],int(v['nb_read_frames']))==(1080,1920,'60/1',360)"
      - uses: actions/upload-artifact@v4
        with:
          name: snow-scene-${{ matrix.scene }}
          path: video-studio-v6/lombok-snow/out/
          if-no-files-found: error
  assemble:
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: snow-scene-*
          path: parts
      - run: |
          mkdir final
          printf "file '%s'\n" "$PWD/parts/snow-scene-first-snow/scene.mp4" "$PWD/parts/snow-scene-sade/scene.mp4" > concat.txt
          ffmpeg -v error -y -f concat -safe 0 -i concat.txt -c:v copy visual.mp4
          python video-studio-v6/lombok-snow/audio.py
          ffmpeg -v error -y -i visual.mp4 -i ambience.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 128k -t 12 -movflags +faststart final/lombok-snow-v6-preview.mp4
          ffprobe -v error -count_frames -show_streams -show_format -of json final/lombok-snow-v6-preview.mp4 > final/report.json
          python -c "import json; r=json.load(open('final/report.json')); v=next(s for s in r['streams'] if s['codec_type']=='video'); assert (v['width'],v['height'],v['r_frame_rate'],int(v['nb_read_frames']))==(1080,1920,'60/1',720); assert any(s['codec_type']=='audio' for s in r['streams']); assert abs(float(r['format']['duration'])-12)<.15"
          ffmpeg -v error -xerror -i final/lombok-snow-v6-preview.mp4 -f null -
          cp parts/snow-scene-first-snow/preview.png final/scene-03.png
          cp parts/snow-scene-sade/preview.png final/scene-07.png
          cp video-studio-v6/lombok-snow/project.json final/storyboard.json
      - uses: actions/upload-artifact@v4
        with:
          name: lombok-snow-v6-preview
          path: final/
          if-no-files-found: error
          retention-days: 30
